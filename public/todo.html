<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List | Govt of Bangladesh</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/todo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>

<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <h3 id="userName">Loading...</h3>
                <p id="userNid" style="color: var(--text-muted); font-size: 0.8rem;">...</p>
            </div>
            <nav class="nav-links">
                <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="documents.html"><i class="fas fa-folder"></i> My Documents</a>
                <a href="history.html"><i class="fas fa-history"></i> History</a>
                <a href="#" class="active"><i class="fas fa-tasks"></i> To Do</a>
                <a href="community.html"><i class="fas fa-users"></i> Community</a>
                <a href="market.html"><i class="fas fa-chart-line"></i> Market Info</a>
                <a href="events.html"><i class="fas fa-bullhorn"></i> Notices</a>
                <a href="education.html"><i class="fas fa-graduation-cap"></i> Education</a>
                <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
                <a href="javascript:void(0)" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-bar">
                <div>
                    <h1>My To-Do List</h1>
                    <p style="color: var(--text-muted);">Manage your tasks and priorities</p>
                </div>
            </div>

            <!-- Kanban -->
            <div>
                <div class="kanban-board">
                    <div class="kanban-column">
                        <div class="kanban-header" style="color: #fbbf24">To Do</div>
                        <div id="todo" class="kanban-list" data-status="todo"></div>
                        <button class="add-task-btn" onclick="createTask()">+ Add Item</button>
                    </div>
                    <div class="kanban-column">
                        <div class="kanban-header" style="color: #60a5fa">In Progress</div>
                        <div id="progress" class="kanban-list" data-status="progress"></div>
                    </div>
                    <div class="kanban-column">
                        <div class="kanban-header" style="color: #34d399">Done</div>
                        <div id="done" class="kanban-list" data-status="done"></div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
